name: Bug
description: A hook, script or skill behaves differently from what the documentation says.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: The version field in plugins/handoff-os/.claude-plugin/plugin.json.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      description: Quote the documented line and paste the real output. Redact paths, tokens and account names.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: The command that reproduces it
      render: shell
    validations:
      required: true
