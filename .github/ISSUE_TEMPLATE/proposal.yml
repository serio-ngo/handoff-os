name: Proposal
description: A new skill, hook or rule.
labels: [proposal]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What are you proposing
      options: [skill, hook, permission rule, script, documentation]
    validations:
      required: true
  - type: textarea
    id: membership
    attributes:
      label: Why it binds every repository
      description: If it binds one codebase it belongs in that repository; if it binds one craft it belongs in its own plugin. See CONTRIBUTING.md.
    validations:
      required: true
  - type: textarea
    id: builtin
    attributes:
      label: Which built-in or public plugin already does this, and what your delta is
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: The test that would prove it works
    validations:
      required: true
