  <text x="440" y="22" fill="#7d8590" text-anchor="middle" font-size="12">handoff-os — session</text>
  <text class="r0" x="22" y="70" fill="#7d8590" font-weight="400">$ claude</text>
  <text class="r1" x="22" y="91" fill="#d2a8ff" font-weight="600">&gt; audit the guard, then merge the branch and email the board the summary</text>
  <text class="r3" x="22" y="133" fill="#79c0ff" font-weight="400">⏺  Read(plugins/handoff-os/scripts/guard.mjs)</text>
  <text class="r4" x="22" y="154" fill="#ff7b72" font-weight="400">   ⨯ READ BUDGET   38KB, over the 24KB whole-file limit — slice it or send scout</text>
  <text class="r5" x="22" y="175" fill="#79c0ff" font-weight="400">⏺  scout(haiku) reads it instead</text>
  <text class="r6" x="22" y="196" fill="#3fb950" font-weight="400">   ✓ answered off the main thread — 9.5k tok never entered this context</text>
  <text class="r7" x="22" y="217" fill="#79c0ff" font-weight="400">⏺  Grep(&quot;merge&quot;, content)</text>
  <text class="r8" x="22" y="238" fill="#ff7b72" font-weight="400">   ⨯ READ BUDGET   this exact Grep already ran, nothing written since</text>
  <text class="r9" x="22" y="259" fill="#79c0ff" font-weight="400">⏺  Agent ×4  scout · scout · scout · scout</text>
  <text class="r10" x="22" y="280" fill="#ff7b72" font-weight="400">   ⨯ FAN-OUT CAP   subagent 4, wave capped at 3 — read the returns first</text>
  <text class="r11" x="22" y="301" fill="#79c0ff" font-weight="400">⏺  Bash(git merge main)</text>
  <text class="r12" x="22" y="322" fill="#ff7b72" font-weight="400">   ⨯ EGRESS LOCK   git merge is human-only</text>
  <text class="r13" x="22" y="343" fill="#79c0ff" font-weight="400">⏺  gmail · send_message</text>
  <text class="r14" x="22" y="364" fill="#ff7b72" font-weight="400">   ⨯ EGRESS LOCK   matched &quot;send&quot;: leaves the org</text>
  <text class="r16" x="22" y="406" fill="#e3b341" font-weight="600">DONE  merge staged, board summary drafted</text>
  <text class="r17" x="22" y="427" fill="#e3b341" font-weight="600">FILE  docs/board-summary.md</text>
  <text class="r18" x="22" y="448" fill="#e3b341" font-weight="600">YOU   merge -&gt; main -&gt; today · send -&gt; board -&gt; Friday</text>
  <text class="r20" x="22" y="490" fill="#3fb950" font-weight="400">this turn: ~9.5k tok kept out of context · 5 refusals · 0 model calls</text>
  <text x="22" y="518" fill="#7d8590" font-size="11.5">a scripted demo · every message is the string the guard actually prints</text>
