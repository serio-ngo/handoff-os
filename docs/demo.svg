<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 436" width="860" height="436" role="img" aria-label="handoff-os admitting a small read, refusing a 38KB read, capping a 20-agent opus wave and blocking a send, then printing session totals">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;white-space:pre}
    .row{opacity:0;animation:in 20s infinite both}
    @keyframes in{0%{opacity:0;transform:translateY(5px)}4%{opacity:1;transform:translateY(0)}94%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}
    @keyframes type{0%{width:0}100%{width:296px}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes flash{0%{opacity:0}18%{opacity:.32}100%{opacity:.08}}
    @keyframes sweep{0%{opacity:0;transform:scaleX(0)}30%{opacity:.2}100%{opacity:0;transform:scaleX(1)}}
    @keyframes okflash{0%{opacity:0}18%{opacity:.22}100%{opacity:.06}}
    .f{transform-box:fill-box;transform-origin:left center}
    .r1{animation-delay:.2s}.r2{animation-delay:1.4s}.r3{animation-delay:2.4s}.r4{animation-delay:3.2s}
    .r5{animation-delay:4.0s}.r6{animation-delay:4.8s}.r7{animation-delay:5.6s}.r8{animation-delay:6.4s}
    .r9{animation-delay:7.4s}.r10{animation-delay:8.2s}.r11{animation-delay:9.2s}.r12{animation-delay:10.0s}
    .s1{animation-delay:11.0s}.s2{animation-delay:11.7s}.s3{animation-delay:12.4s}
    .bar{opacity:0;animation:flash 20s infinite both}
    .b6{animation-delay:4.8s}.b10{animation-delay:8.2s}.b12{animation-delay:10.0s}
    .glow{opacity:0;animation:sweep 20s infinite both;transform-box:fill-box;transform-origin:left center}
    .g6{animation-delay:4.8s}.g10{animation-delay:8.2s}.g12{animation-delay:10.0s}
    .okbar{opacity:0;animation:okflash 20s infinite both}
    .o8{animation-delay:6.4s}
    .cursor{animation:blink 1s steps(1) infinite}
    .typed{animation:type 1s steps(38) .2s both}
  </style>

  <rect width="860" height="436" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 32 H860 M0 10 a10 10 0 0 1 10 -10 h840 a10 10 0 0 1 10 10 v22 H0 Z" fill="#161b22" stroke="#30363d"/>
  <circle cx="20" cy="16" r="4.5" fill="#ff5f57"/><circle cx="37" cy="16" r="4.5" fill="#febc2e"/><circle cx="54" cy="16" r="4.5" fill="#28c840"/>
  <text x="430" y="21" fill="#7d8590" text-anchor="middle" font-size="11.5">handoff-os — session</text>

  <rect class="okbar o8" x="14" y="229" width="832" height="21" rx="4" fill="#3fb950" fill-opacity=".45"/>
  <rect class="bar b6" x="14" y="182" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".07"/>
  <rect class="bar b10" x="14" y="278" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".07"/>
  <rect class="bar b12" x="14" y="326" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".07"/>
  <rect class="glow g6" x="14" y="182" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".12"/>
  <rect class="glow g10" x="14" y="278" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".12"/>
  <rect class="glow g12" x="14" y="326" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".12"/>

  <text class="row r1" x="22" y="60" fill="#7d8590">$ claude</text>

  <clipPath id="t"><rect class="typed" x="22" y="72" height="18"/></clipPath>
  <g class="row r2" clip-path="url(#t)"><text x="22" y="86" fill="#d2a8ff" font-weight="600">&gt; audit the guard, then email the board</text></g>

  <text class="row r3"  x="22" y="122" fill="#79c0ff">⏺  Read package.json</text>
  <text class="row r4"  x="22" y="147" fill="#7d8590">✓  admitted · 4.7k entered this thread</text>
  <text class="row r5"  x="22" y="172" fill="#79c0ff">⏺  Read guard.mjs</text>
  <text class="row r6"  x="22" y="197" fill="#ff7b72" font-weight="600">⨯  READ BUDGET · 38KB over the 24KB cap</text>
  <text class="row r7"  x="22" y="222" fill="#79c0ff">⏺  Agent handoff-os:scout reads it instead</text>
  <text class="row r8"  x="22" y="244" fill="#3fb950">✓  answered · 9.5k never entered this thread</text>
  <text class="row r9"  x="22" y="269" fill="#79c0ff">⏺  20 × opus agents · QUALITY: writing</text>
  <text class="row r10" x="22" y="293" fill="#ff7b72" font-weight="600">⨯  FAN-OUT CAP · 17 blocked, 3 per wave</text>
  <text class="row r11" x="22" y="317" fill="#79c0ff">⏺  gmail send_message</text>
  <text class="row r12" x="22" y="341" fill="#ff7b72" font-weight="600">⨯  EGRESS LOCK · send blocked, human-only</text>

  <g>
    <rect class="row s1" x="14" y="353" width="832" height="68" rx="4" fill="#3fb950" fill-opacity=".08"/>
    <text class="row s1" x="22" y="368" fill="#3fb950" font-weight="600">HANDOFF OS · ~9.5k kept out of context (67%)</text>
    <text class="row s2" x="22" y="388" fill="#3fb950">19 guard actions</text>
    <text class="row s3" x="22" y="408" fill="#3fb950">used 1 scout</text>
    <g class="row s3"><rect class="cursor" x="126" y="397" width="7" height="12" fill="#3fb950"/></g>
  </g>
</svg>
