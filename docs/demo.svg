<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 306" width="860" height="306" role="img" aria-label="handoff-os on a 100-subagent request: 3 start, the FAN-OUT CAP holds 97 for the next wave, the Stop receipt prints HANDOFF OS · dispatches: 97 held for the next wave · 3 used" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
<style>
text{font-size:13.5px;white-space:pre}
.row{opacity:0;animation:in 12s infinite both}
@keyframes in{0%{opacity:0;transform:translateY(4px)}3%{opacity:1;transform:translateY(0)}94%{opacity:1}97%,100%{opacity:0}}
@keyframes type{0%{width:0}100%{width:624px}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.typed{animation:type 1.4s steps(76) .8s both}
.cursor{animation:blink 1s steps(1) infinite}
.d0{animation-delay:0.2s}.d1{animation-delay:0.8s}.d2{animation-delay:2.6s}.d3{animation-delay:3s}.d4{animation-delay:3.4s}.d5{animation-delay:4.2s}.d6{animation-delay:5.2s}.d7{animation-delay:6.2s}.d8{animation-delay:7.2s}
</style>
<rect x="0.5" y="0.5" width="859" height="305" rx="10" fill="#7d8590" fill-opacity=".07" stroke="#7d8590" stroke-opacity=".35"/>
<path d="M0 34 H860" stroke="#7d8590" stroke-opacity=".35"/>
<text x="22" y="22" fill="#7d8590" font-size="11.5">— handoff-os session</text>
<text x="22" y="60" fill="#7d8590" font-size="12" class="row d0">$ claude</text>
<clipPath id="t"><rect class="typed" x="22" y="70" height="18"/></clipPath>
<g class="row d1" clip-path="url(#t)"><text x="22" y="84" fill="#7d8590" font-size="12" font-weight="600">&gt; src/ has 100 modules. Launch one subagent per module, all 100 in parallel.</text></g>
<text x="22" y="108" fill="#2a78d6" font-size="12" class="row d2">⏺  Agent · mod001.js</text>
<text x="22" y="132" fill="#2a78d6" font-size="12" class="row d3">⏺  Agent · mod002.js</text>
<text x="22" y="156" fill="#2a78d6" font-size="12" class="row d4">⏺  Agent · mod003.js</text>
<rect class="row d5" x="14" y="164" width="832" height="22" rx="4" fill="#d95926" fill-opacity=".1"/>
<text x="22" y="180" fill="#d95926" font-size="12" font-weight="600" class="row d5">⨯  FAN-OUT CAP: subagent 4, wave capped at 3. Dispatch the rest yourself once these return.</text>
<text x="22" y="204" fill="#d95926" font-size="12" class="row d6">⨯  mod005 … mod100 · 96 more, same refusal</text>
<text x="22" y="228" fill="#2a78d6" font-size="12" class="row d7">⏺  3 returned · next wave dispatches the rest</text>
<rect class="row d8" x="14" y="235" width="832" height="30" rx="4" fill="#7d8590" fill-opacity=".08" stroke="#7d8590" stroke-opacity=".35"/>
<text x="22" y="252" fill="#7d8590" font-size="12" font-weight="600" class="row d8">HANDOFF OS · dispatches: 97 held for the next wave · 3 used</text>
<g class="row d8"><rect class="cursor" x="512" y="241" width="7" height="13" fill="#2a78d6"/></g>
</svg>
