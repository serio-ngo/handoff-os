<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 404" width="860" height="404" role="img" aria-label="handoff-os refusing a 38KB read, a fourth subagent and an outward send, then printing a handoff card">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;white-space:pre}
    .row{opacity:0;animation:in 20s infinite both}
    @keyframes in{0%{opacity:0;transform:translateY(5px)}4%{opacity:1;transform:translateY(0)}94%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}
    @keyframes type{0%{width:0}100%{width:296px}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes flash{0%{opacity:0}18%{opacity:.9}100%{opacity:.16}}
    @keyframes sweep{0%{opacity:0;transform:scaleX(0)}30%{opacity:.55}100%{opacity:0;transform:scaleX(1)}}
    .f{transform-box:fill-box;transform-origin:left center}
    .r1{animation-delay:.2s}.r2{animation-delay:1.4s}.r3{animation-delay:2.6s}.r4{animation-delay:3.5s}
    .r5{animation-delay:4.7s}.r6{animation-delay:5.6s}.r7{animation-delay:6.8s}.r8{animation-delay:7.7s}
    .r9{animation-delay:8.9s}.r10{animation-delay:9.8s}.r11{animation-delay:11.2s}.r12{animation-delay:12.0s}
    .r13{animation-delay:12.8s}.r14{animation-delay:14.2s}
    .bar{opacity:0;animation:flash 20s infinite both}
    .b4{animation-delay:3.5s}.b8{animation-delay:7.7s}.b10{animation-delay:9.8s}
    .glow{opacity:0;animation:sweep 20s infinite both;transform-box:fill-box;transform-origin:left center}
    .g4{animation-delay:3.5s}.g8{animation-delay:7.7s}.g10{animation-delay:9.8s}
    .cursor{animation:blink 1s steps(1) infinite}
    .typed{animation:type 1s steps(38) .2s both}
  </style>

  <rect width="860" height="404" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 32 H860 M0 10 a10 10 0 0 1 10 -10 h840 a10 10 0 0 1 10 10 v22 H0 Z" fill="#161b22" stroke="#30363d"/>
  <circle cx="20" cy="16" r="4.5" fill="#ff5f57"/><circle cx="37" cy="16" r="4.5" fill="#febc2e"/><circle cx="54" cy="16" r="4.5" fill="#28c840"/>
  <text x="430" y="21" fill="#7d8590" text-anchor="middle" font-size="11.5">handoff-os — session</text>

  <rect class="bar b4" x="14" y="132" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".10"/>
  <rect class="bar b8" x="14" y="228" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".10"/>
  <rect class="bar b10" x="14" y="276" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".10"/>
  <rect class="glow g4" x="14" y="132" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".22"/>
  <rect class="glow g8" x="14" y="228" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".22"/>
  <rect class="glow g10" x="14" y="276" width="832" height="21" rx="4" fill="#ff7b72" fill-opacity=".22"/>

  <text class="row r1" x="22" y="60" fill="#7d8590">$ claude</text>

  <clipPath id="t"><rect class="typed" x="22" y="72" height="18"/></clipPath>
  <g class="row r2" clip-path="url(#t)"><text x="22" y="86" fill="#d2a8ff" font-weight="600">&gt; audit the guard, then email the board</text></g>

  <text class="row r3"  x="22" y="122" fill="#79c0ff">⏺  Read guard.mjs</text>
  <text class="row r4"  x="22" y="147" fill="#ff7b72" font-weight="600">⨯  READ BUDGET · 38KB over the 24KB cap</text>
  <text class="row r5"  x="22" y="172" fill="#79c0ff">⏺  Agent handoff-os:scout reads it instead</text>
  <text class="row r6"  x="22" y="194" fill="#3fb950">✓  answered · 9.5k never entered this thread</text>
  <text class="row r7"  x="22" y="219" fill="#79c0ff">⏺  Agent ×4 scouts</text>
  <text class="row r8"  x="22" y="243" fill="#ff7b72" font-weight="600">⨯  FAN-OUT CAP · 4th blocked, 3 per wave</text>
  <text class="row r9"  x="22" y="267" fill="#79c0ff">⏺  gmail send_message</text>
  <text class="row r10" x="22" y="291" fill="#ff7b72" font-weight="600">⨯  EGRESS LOCK · send blocked, human-only</text>

  <text class="row r11" x="22" y="322" fill="#e3b341" font-weight="600">DONE  board summary drafted</text>
  <text class="row r12" x="22" y="342" fill="#e3b341" font-weight="600">FILE  docs/board-summary.md</text>
  <text class="row r13" x="22" y="362" fill="#e3b341" font-weight="600">YOU   send -&gt; board -&gt; Friday</text>

  <g class="row r14">
    <rect x="14" y="374" width="832" height="20" rx="4" fill="#3fb950" fill-opacity=".08"/>
    <text x="22" y="389" fill="#3fb950" font-weight="600">HANDOFF OS · 3 refusals · ~9.5k tok kept out · 1 scout</text>
    <rect class="cursor" x="486" y="378" width="7" height="12" fill="#3fb950"/>
  </g>
</svg>
