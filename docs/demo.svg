<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 386" width="860" height="386" role="img" aria-label="handoff-os refusing a 38KB read, capping a 20-agent ultrathink opus wave and blocking a send, then printing session totals">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;white-space:pre}
    .row{opacity:0;animation:in 20s infinite both}
    @keyframes in{0%{opacity:0;transform:translateY(5px)}4%{opacity:1;transform:translateY(0)}94%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}
    @keyframes type{0%{width:0}100%{width:296px}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes flash{0%{opacity:0}18%{opacity:.32}100%{opacity:.08}}
    @keyframes sweep{0%{opacity:0;transform:scaleX(0)}30%{opacity:.2}100%{opacity:0;transform:scaleX(1)}}
    @keyframes okflash{0%{opacity:0}18%{opacity:.22}100%{opacity:.06}}
    .f{transform-box:fill-box;transform-origin:left center}
    .r1{animation-delay:.2s}.r2{animation-delay:1.4s}.r3{animation-delay:2.4s}.r4{animation-delay:3.2s}
    .r5{animation-delay:4.0s}.r6{animation-delay:4.8s}.r7{animation-delay:5.6s}.r8{animation-delay:6.4s}
    .r9{animation-delay:7.4s}.r10{animation-delay:8.2s}.r11{animation-delay:9.2s}.r12{animation-delay:10.0s}
    .s1{animation-delay:11.0s}.s2{animation-delay:11.7s}.s3{animation-delay:12.4s}
    .bar{opacity:0;animation:flash 20s infinite both}
    .b6{animation-delay:4.8s}.b10{animation-delay:8.2s}.b12{animation-delay:10.0s}
    .glow{opacity:0;animation:sweep 20s infinite both;transform-box:fill-box;transform-origin:left center}
    .g6{animation-delay:4.8s}.g10{animation-delay:8.2s}.g12{animation-delay:10.0s}
    .okbar{opacity:0;animation:okflash 20s infinite both}
    .o8{animation-delay:6.4s}
    .cursor{animation:blink 1s steps(1) infinite}
    .typed{animation:type 1s steps(38) .2s both}
  </style>

  <rect width="860" height="386" rx="10" fill="#141210" stroke="#2e2a26"/>
  <path d="M0 34 H860" stroke="#2e2a26"/>
  <text x="22" y="22" fill="#57534e" font-size="11.5">— handoff-os session</text>

  <rect class="okbar o8" x="14" y="179" width="832" height="21" rx="4" fill="#7dc98f" fill-opacity=".45"/>
  <rect class="bar b6" x="14" y="132" width="832" height="21" rx="4" fill="#e08888" fill-opacity=".07"/>
  <rect class="bar b10" x="14" y="228" width="832" height="21" rx="4" fill="#e08888" fill-opacity=".07"/>
  <rect class="bar b12" x="14" y="276" width="832" height="21" rx="4" fill="#e08888" fill-opacity=".07"/>
  <rect class="glow g6" x="14" y="132" width="832" height="21" rx="4" fill="#e08888" fill-opacity=".12"/>
  <rect class="glow g10" x="14" y="228" width="832" height="21" rx="4" fill="#e08888" fill-opacity=".12"/>
  <rect class="glow g12" x="14" y="276" width="832" height="21" rx="4" fill="#e08888" fill-opacity=".12"/>

  <text class="row r1" x="22" y="60" fill="#8b8680">$ claude</text>

  <clipPath id="t"><rect class="typed" x="22" y="72" height="18"/></clipPath>
  <g class="row r2" clip-path="url(#t)"><text x="22" y="86" fill="#f0ebe3" font-weight="600">&gt; audit the guard, then email the board</text></g>

  <text class="row r5"  x="22" y="122" fill="#d97757">⏺  Read guard.mjs</text>
  <text class="row r6"  x="22" y="147" fill="#e08888" font-weight="600">⨯  READ BUDGET · 38KB over the 24KB cap</text>
  <text class="row r7"  x="22" y="172" fill="#d97757">⏺  Agent handoff-os:scout reads it instead</text>
  <text class="row r8"  x="22" y="194" fill="#7dc98f">✓  answered · 9.5k never entered this thread</text>
  <text class="row r9"  x="22" y="219" fill="#d97757">⏺  20 × opus agents · ultrathink</text>
  <text class="row r10" x="22" y="243" fill="#e08888" font-weight="600">⨯  FAN-OUT CAP · 17 blocked, 3 per wave</text>
  <text class="row r11" x="22" y="267" fill="#d97757">⏺  gmail send_message</text>
  <text class="row r12" x="22" y="291" fill="#e08888" font-weight="600">⨯  EGRESS LOCK · send blocked</text>

  <g>
    <rect class="row s1" x="14" y="303" width="832" height="68" rx="4" fill="#1d1a16" stroke="#2e2a26"/>
    <text class="row s1" x="22" y="318" fill="#7dc98f" font-weight="600">HANDOFF OS · ~9.5k kept out of context (67%)</text>
    <text class="row s2" x="22" y="338" fill="#8b8680">19 guard actions</text>
    <text class="row s3" x="22" y="358" fill="#8b8680">used 1 scout</text>
    <g class="row s3"><rect class="cursor" x="140" y="347" width="7" height="12" fill="#d97757"/></g>
  </g>
</svg>
